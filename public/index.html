<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>德州扑克 · 在线对战</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录界面 -->
<div id="login-screen" class="screen">
  <div class="login-box">
    <h1>♠ 德州扑克 ♥</h1>
    <p class="subtitle">在线多人对战 · 支持 2-7 人</p>
    <div class="form-group">
      <label>昵称</label>
      <input type="text" id="name-input" placeholder="输入你的昵称" maxlength="12">
    </div>
    <div class="form-group">
      <label>房间号</label>
      <input type="text" id="room-input" placeholder="输入或创建房间号" maxlength="20">
    </div>
    <button id="join-btn" class="btn-primary">进入房间</button>
    <p class="tip">提示：同一房间号的玩家会进入同一桌。创建房间后把房间号分享给朋友即可联机。</p>
  </div>
</div>

<!-- 游戏界面 -->
<div id="game-screen" class="screen hidden">
  <!-- 连接状态横幅（PRD-02） -->
  <div id="conn-banner" class="conn-banner hidden"></div>

  <div class="game-header">
    <div class="room-info">
      <span class="label">房间:</span>
      <span id="room-id-display"></span>
      <button id="copy-room" class="btn-small">复制</button>
    </div>
    <div class="header-right">
      <button id="leave-btn" class="btn-small">离开</button>
    </div>
  </div>

  <div class="game-main">
    <div class="table-container">
      <div id="poker-table">
        <div class="table-felt">
          <!-- 社区牌 -->
          <div class="community-cards" id="community-cards"></div>
          <!-- 底池 -->
          <div class="pot-display">
            <div class="pot-label">底池</div>
            <div class="pot-amount" id="pot-amount">0</div>
          </div>
          <!-- 阶段 -->
          <div class="stage-display" id="stage-display">等待开始</div>
          <!-- 玩家座位由 JS 动态生成 -->
          <div id="player-seats"></div>
        </div>
      </div>

      <!-- 操作区 -->
      <div class="action-bar" id="action-bar">
        <div class="action-info">
          <div id="turn-info">等待其他玩家...</div>
          <div id="turn-countdown" class="turn-countdown hidden"></div>
          <div class="bet-info">
            <span>跟注: <b id="call-amount">0</b></span>
            <span>加注到: <b id="min-raise">0</b></span>
          </div>
        </div>
        <div class="action-buttons">
          <button class="btn-action fold" data-action="fold">弃牌</button>
          <button class="btn-action check" data-action="check">过牌</button>
          <button class="btn-action call" data-action="call">跟注</button>
          <div class="raise-group">
            <input type="range" id="raise-slider" min="0" max="100" value="0">
            <input type="number" id="raise-input" min="0" value="0">
            <button class="btn-action raise" data-action="raise">加注</button>
          </div>
          <button class="btn-action allin" data-action="allin">全押</button>
        </div>
        <div class="start-area" id="start-area">
          <button id="start-btn" class="btn-primary">开始新一局</button>
        </div>
      </div>
    </div>

    <!-- 侧边栏：聊天和日志 -->
    <div class="sidebar">
      <div class="log-panel">
        <h3>牌局日志</h3>
        <div id="game-log"></div>
      </div>
      <div class="chat-panel">
        <h3>聊天</h3>
        <div id="chat-messages"></div>
        <div class="chat-input">
          <input type="text" id="chat-input" placeholder="输入消息..." maxlength="100">
          <button id="chat-send">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 结算弹窗 -->
<div id="result-modal" class="modal hidden">
  <div class="modal-content">
    <h2>本局结算</h2>
    <div id="result-details"></div>
    <div class="modal-actions">
      <button id="result-next" class="btn-primary">开始下一局</button>
      <button id="result-close" class="btn-small">关闭</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
